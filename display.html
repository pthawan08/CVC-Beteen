<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กล่องของขวัญ</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #fdf2f8; margin: 0; padding: 20px; color: #333; text-align: center; }
        .back-btn { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #ec4899; font-weight: bold; font-size: 16px; background: white; padding: 8px 15px; border-radius: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left;}
        .header { margin-bottom: 30px; }
        h1 { color: #ec4899; font-size: 28px; margin-bottom: 5px; }
        .wishes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        
        .wish-card { padding: 20px; border-radius: 20px; text-align: left; display: flex; flex-direction: column; background: white;}
        .frame-classic { border: 2px solid #fbcfe8; }
        .frame-polaroid { box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); border-radius: 5px; padding-bottom: 30px; }
        .frame-party { background: linear-gradient(135deg, #1e3a8a, #7e22ce); color: white; }
        
        .wish-image { width: 100%; height: auto; border-radius: 10px; margin-bottom: 15px; }
        .frame-polaroid .wish-image { border-radius: 0; }
        
        .wish-message { font-size: 16px; line-height: 1.6; margin-bottom: auto; white-space: pre-line; }
        .wish-name { font-weight: bold; font-size: 15px; text-align: right; color: #ec4899; margin-top: 15px;}
        .frame-party .wish-message { color: white;}
        .frame-party .wish-name { color: #fbbf24;}
    </style>
</head>
<body>
    
    <div style="text-align: left;">
        <a href="index.html" class="back-btn">← กลับหน้าหลัก</a>
    </div>

    <div class="header">
        <h1 id="bdayTitle">กล่องของขวัญ 🎁</h1>
        <p>กำลังรวบรวมข้อความอวยพร...</p>
    </div>
    
    <div id="wishesContainer" class="wishes-grid"></div>

    <script>
        // 🛑🛑 นำ URL จาก Apps Script มาใส่ตรงนี้ 🛑🛑
        const API_URL = "https://script.google.com/macros/s/AKfycbyxF8L7G5D9rmZR7PVeR3B4yQbULzAzQG0Dfo1aCQdj-FWqueb5cnelpCnKuTBEk04dpw/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const target = urlParams.get('target');

        if (target) {
            document.getElementById('bdayTitle').innerText = `Happy Birthday ${target}! 🎂`;
        }

        // --- ฟังก์ชันสร้างระบบขูดการ์ด ---
        function initScratchCard(canvas) {
            const ctx = canvas.getContext('2d');
            
            // ตั้งค่าขนาด canvas ให้เท่ากับขนาดของการ์ด
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            
            // เทสีปิดทับ (ฟอยล์สีเทาอมชมพู)
            ctx.fillStyle = '#cbd5e1'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // เขียนข้อความบนฟอยล์
            ctx.font = 'bold 20px "Segoe UI", Tahoma, sans-serif';
            ctx.fillStyle = '#475569';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🪙 ใช้นิ้วถูเพื่อเปิดดูของขวัญ!', canvas.width/2, canvas.height/2);

            let isDrawing = false;

            function getCoordinates(e) {
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) {
                    return { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
                }
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            }

            function scratch(e) {
                if (!isDrawing) return;
                e.preventDefault(); // ป้องกันหน้าจอเลื่อนตอนถู
                const pos = getCoordinates(e);
                
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 25, 0, 2 * Math.PI); // ขนาดของ "เหรียญ" ที่ใช้ขูด
                ctx.fill();
            }

            // รองรับการใช้เมาส์ (PC)
            canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
            canvas.addEventListener('mousemove', scratch);
            window.addEventListener('mouseup', () => isDrawing = false);

            // รองรับการใช้นิ้วสัมผัส (Mobile)
            canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); }, {passive: false});
            canvas.addEventListener('touchmove', scratch, {passive: false});
            window.addEventListener('touchend', () => isDrawing = false);
        }

        async function fetchWishes() {
            const container = document.getElementById('wishesContainer');
            try {
                const response = await fetch(`${API_URL}?target=${target}`);
                const result = await response.json();

                if (result.status === "success" && result.data.length > 0) {
                    result.data.forEach((wish) => {
                        const card = document.createElement('div');
                        const frameClass = wish.frame ? `frame-${wish.frame}` : 'frame-classic';
                        // เพิ่ม position: relative เพื่อให้ Canvas ซ้อนทับได้พอดี
                        card.className = `wish-card ${frameClass}`;
                        card.style.position = 'relative'; 
                        card.style.overflow = 'hidden'; // กันฟอยล์ล้นกรอบ

                        const imageHTML = wish.image ? `<img src="${wish.image}" class="wish-image">` : '';

                        // ใส่ Canvas ไว้ชั้นบนสุด (z-index: 10)
                        card.innerHTML = `
                            <canvas class="scratch-pad" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: pointer;"></canvas>
                            <div style="position: relative; z-index: 1; user-select: none;">
                                ${imageHTML}
                                <div class="wish-message">"${wish.message}"</div>
                                <div class="wish-name">จาก: ${wish.sender}</div>
                            </div>
                        `;
                        container.appendChild(card);

                        // เรียกใช้งานฟังก์ชันขูดการ์ดบน Canvas ของการ์ดใบนี้
                        const canvas = card.querySelector('.scratch-pad');
                        // ใช้ setTimeout เพื่อรอให้เบราว์เซอร์วาดขนาดการ์ดเสร็จก่อน ค่อยเทสีทับ
                        setTimeout(() => initScratchCard(canvas), 100); 
                    });
                    
                    // จุดพลุ
                    confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
                } else {
                    container.innerHTML = '<p style="text-align:center; width:100%;">ยังไม่มีคนส่งคำอวยพรมาเลย เป็นคนแรกสิ! 😊</p>';
                }
            } catch (error) {
                container.innerHTML = '<p style="color:red; text-align:center;">โหลดข้อมูลไม่สำเร็จ 😢</p>';
            }
        }
        fetchWishes();
    </script>
</body>
</html>
