<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BETEEN - Birthday Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            margin: 0;
            padding: 40px 20px;
            color: #334155;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        h1 {
            color: #3b82f6;
            font-size: 32px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #64748b;
            font-size: 16px;
        }

        /* โครงสร้าง Grid หลัก แบ่ง 4 หน่วย */
        .org-chart {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* กล่องของแต่ละหน่วย */
        .unit-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* หัวหน้าหน่วย / ชื่อหน่วย */
        .unit-head {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            padding: 15px 30px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 20px;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }

        /* เส้นเชื่อม (Tree Line) */
        .tree-line {
            width: 2px;
            background-color: #cbd5e1;
            height: 20px;
            margin-top: -20px;
            margin-bottom: 10px;
        }

        /* กล่องรายชื่อสมาชิก */
        .members-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 2px solid #cbd5e1;
            padding-top: 20px;
            position: relative;
        }

        /* การ์ดรายบุคคล (กดได้) */
        .member-card {
            background-color: white;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-card:hover {
            transform: translateY(-3px);
            border-color: #3b82f6;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        /* ตกแต่งสีแต่ละหน่วยให้ไม่น่าเบื่อ */
        .unit-beton .unit-head { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
        .unit-bestrong .unit-head { background: linear-gradient(135deg, #10b981, #34d399); }
        .unit-belove .unit-head { background: linear-gradient(135deg, #ec4899, #f43f5e); }
        .unit-bebless .unit-head { background: linear-gradient(135deg, #f59e0b, #fbbf24); }

        .role-badge {
            font-size: 12px;
            background-color: #f1f5f9;
            padding: 4px 8px;
            border-radius: 20px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎂 BETEEN Birthday Hub องค์กร</h1>
        <p class="subtitle">เลือกรายชื่อเพื่อส่งคำอวยพร หรือดูของขวัญของแต่ละคนได้เลย</p>
    </div>

    <div class="org-chart">
        
        <!-- หน่วย BeTon -->
        <div class="unit-column unit-beton">
            <div class="unit-head">BeTon</div>
            <div class="members-container">
                <div class="member-card" onclick="openProfile('พี่เพลง')">
                    <span>พี่เพลง</span> <span class="role-badge">หนซ.</span>
                </div>
                <div class="member-card" onclick="openProfile('แซม')">
                    <span>แซม</span> <span class="role-badge">ผช.</span>
                </div>
                <div class="member-card" onclick="openProfile('โอเบ')">
                    <span>โอเบ</span> <span class="role-badge">ผช.</span>
                </div>
                <div class="member-card" onclick="openProfile('ดีน')">
                    <span>ดีน</span> <span class="role-badge">ผช.</span>
                </div>
            </div>
        </div>

        <!-- หน่วย BeStrong -->
        <div class="unit-column unit-bestrong">
            <div class="unit-head">BeStrong</div>
            <div class="members-container">
                <div class="member-card" onclick="openProfile('พี่แซนด์')">
                    <span>พี่แซนด์</span> <span class="role-badge">หนซ.</span>
                </div>
                <div class="member-card" onclick="openProfile('เดวิด')">
                    <span>เดวิด</span> <span class="role-badge">ผช.</span>
                </div>
                <div class="member-card" onclick="openProfile('ถั่วพู')">
                    <span>ถั่วพู</span> <span class="role-badge">ผช.</span>
                </div>
            </div>
        </div>

        <!-- หน่วย Belove -->
        <div class="unit-column unit-belove">
            <div class="unit-head">Belove</div>
            <div class="members-container">
                <div class="member-card" onclick="openProfile('พี่เจเจ')">
                    <span>พี่เจเจ</span> <span class="role-badge">หนน.</span>
                </div>
                <div class="member-card" onclick="openProfile('จูน')">
                    <span>จูน</span> <span class="role-badge">ผช.</span>
                </div>
                <div class="member-card" onclick="openProfile('การ์ตูน')">
                    <span>การ์ตูน</span> <span class="role-badge">ผช.</span>
                </div>
            </div>
        </div>

        <!-- หน่วย BeBless -->
        <div class="unit-column unit-bebless">
            <div class="unit-head">BeBless</div>
            <div class="members-container">
                <div class="member-card" onclick="openProfile('พี่มุ่ย')">
                    <span>พี่มุ่ย</span> <span class="role-badge">หนซ.</span>
                </div>
                <div class="member-card" onclick="openProfile('ส้มโอ')">
                    <span>ส้มโอ</span> <span class="role-badge">สช.</span>
                </div>
                <div class="member-card" onclick="openProfile('ชมพู่')">
                    <span>ชมพู่</span> <span class="role-badge">สช.</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ฟังก์ชันจำลองเมื่อกดที่ชื่อคน
        function openProfile(name) {
            // ของจริงเราจะให้มันลิงก์เปลี่ยนหน้า เช่น window.location.href = `display.html?target=${name}`;
            alert(`กำลังเปิดหน้า Profile และคำอวยพรวันเกิดของ "${name}" 🎁\n(เดี๋ยวเราค่อยเชื่อมกับหน้า display.html อีกทีครับ)`);
        }
    </script>

</body>
</html>
