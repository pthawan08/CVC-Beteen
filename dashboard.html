<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BETEEN - Birthday Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 40px 20px;
            color: #334155;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: #1e293b;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        /* โครงสร้างแผนผังต้นไม้ */
        .org-chart {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* กล่องตำแหน่งต่างๆ */
        .node-card {
            background: white;
            border-radius: 15px;
            padding: 15px 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            position: relative;
            z-index: 2;
            min-width: 200px;
        }

        /* สีของแต่ละระดับ */
        .level-kwang { background: linear-gradient(135deg, #1e293b, #334155); color: white; } /* แขวง */
        .level-unit-1 { background: linear-gradient(135deg, #3b82f6, #60a5fa); color: white; } /* หน่วย BE ONE */
        .level-unit-2 { background: linear-gradient(135deg, #ec4899, #f472b6); color: white; } /* หน่วย BE TWO */

        .node-title { font-size: 14px; opacity: 0.8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px;}
        .node-name { font-size: 22px; font-weight: bold; }

        /* การจัดเรียงเลเยอร์ */
        .level-container {
            display: flex;
            justify-content: center;
            width: 100%;
            gap: 40px;
            position: relative;
            margin-top: 30px;
        }

        /* เลเยอร์ของเซลล์ */
        .cells-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .cell-column {
            background: white;
            border-radius: 15px;
            width: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
            border-top: 4px solid #cbd5e1;
        }

        /* สีเส้นขอบบนของแต่ละเซลล์ */
        .cell-beton { border-top-color: #0ea5e9; }
        .cell-bestrong { border-top-color: #10b981; }
        .cell-belove { border-top-color: #8b5cf6; }
        .cell-bebless { border-top-color: #f59e0b; }

        .cell-header {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            color: #475569;
        }

        /* รายชื่อสมาชิก */
        .member-list {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 8px;
        }

        .member-card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .member-card:hover {
            border-color: #94a3b8;
            background-color: #f1f5f9;
            transform: scale(1.02);
        }

        .role {
            font-size: 12px;
            color: #64748b;
            background: #e2e8f0;
            padding: 2px 6px;
            border-radius: 10px;
        }

        /* เส้นเชื่อมต่อ (จำลองด้วย border) */
        .branch {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* รองรับหน้าจอมือถือ */
        @media (max-width: 768px) {
            .level-container { flex-direction: column; gap: 30px; align-items: center;}
            .cells-container { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎂 BETEEN Birthday Hub</h1>
        <p>คลิกที่รายชื่อเพื่อเขียนคำอวยพร หรือดูของขวัญวันเกิด</p>
    </div>

    <div class="org-chart">
        
        <!-- เลเยอร์ 1: แขวง -->
        <div class="node-card level-kwang" onclick="openProfile('พี่เจเจ')">
            <div class="node-title">แขวง BETEEN</div>
            <div class="node-name">พี่เจเจ</div>
        </div>

        <!-- เลเยอร์ 2: หน่วย -->
        <div class="level-container">
            
            <!-- สาย BE ONE (พี่เพลง) -->
            <div class="branch">
                <div class="node-card level-unit-1" onclick="openProfile('พี่เพลง')">
                    <div class="node-title">หน่วย BE ONE</div>
                    <div class="node-name">พี่เพลง</div>
                </div>
                
                <!-- เลเยอร์ 3: เซลล์ใต้ BE ONE -->
                <div class="cells-container">
                    <!-- เซลล์ BeTon -->
                    <div class="cell-column cell-beton">
                        <div class="cell-header">เซลล์ BeTon</div>
                        <div class="member-list">
                            <div class="member-card" onclick="openProfile('แซม')"><span>แซม</span> <span class="role">ผช.</span></div>
                            <div class="member-card" onclick="openProfile('โอเบ')"><span>โอเบ</span> <span class="role">ผช.</span></div>
                            <div class="member-card" onclick="openProfile('ดีน')"><span>ดีน</span> <span class="role">ผช.</span></div>
                            <!-- อนาคตใช้ JS ดึงรายชื่อมาแทรกตรงนี้ -->
                        </div>
                    </div>
                    <!-- เซลล์ BeStrong -->
                    <div class="cell-column cell-bestrong">
                        <div class="cell-header">เซลล์ BeStrong</div>
                        <div class="member-list">
                            <div class="member-card" onclick="openProfile('พี่แซนด์')"><span>พี่แซนด์</span> <span class="role">หนซ.</span></div>
                            <div class="member-card" onclick="openProfile('เดวิด')"><span>เดวิด</span> <span class="role">ผช.</span></div>
                            <div class="member-card" onclick="openProfile('ถั่วพู')"><span>ถั่วพู</span> <span class="role">ผช.</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- สาย BE TWO (พี่มุ่ย) -->
            <div class="branch">
                <div class="node-card level-unit-2" onclick="openProfile('พี่มุ่ย')">
                    <div class="node-title">หน่วย BE TWO</div>
                    <div class="node-name">พี่มุ่ย</div>
                </div>
                
                <!-- เลเยอร์ 3: เซลล์ใต้ BE TWO -->
                <div class="cells-container">
                    <!-- เซลล์ Belove -->
                    <div class="cell-column cell-belove">
                        <div class="cell-header">เซลล์ Belove</div>
                        <div class="member-list">
                            <div class="member-card" onclick="openProfile('จูน')"><span>จูน</span> <span class="role">ผช.</span></div>
                            <div class="member-card" onclick="openProfile('การ์ตูน')"><span>การ์ตูน</span> <span class="role">ผช.</span></div>
                        </div>
                    </div>
                    <!-- เซลล์ BeBless -->
                    <div class="cell-column cell-bebless">
                        <div class="cell-header">เซลล์ BeBless</div>
                        <div class="member-list">
                            <div class="member-card" onclick="openProfile('ส้มโอ')"><span>ส้มโอ</span> <span class="role">สช.</span></div>
                            <div class="member-card" onclick="openProfile('ชมพู่')"><span>ชมพู่</span> <span class="role">สช.</span></div>
                        </div>
                    </div>
                </div>
            </div>

        </div> <!-- จบ level-container -->
    </div> <!-- จบ org-chart -->

    <script>
        function openProfile(name) {
            alert(`กำลังเปิดกล่องของขวัญของ: ${name} 🎁`);
        }
    </script>

</body>
</html>
