<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งคำอวยพรวันเกิด</title>
    <style>
        /* (สไตล์พื้นฐานเดิม) */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #fdf2f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .form-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(236, 72, 153, 0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        label { display: block; margin: 15px 0 5px; color: #666; font-weight: bold; font-size: 14px; }
        input[type="text"], textarea, input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-family: inherit; font-size: 16px; }
        
        /* สไตล์สำหรับเลือกกรอบ */
        .frame-options { display: flex; gap: 10px; margin-bottom: 20px; }
        .frame-option { flex: 1; text-align: center; }
        .frame-option input[type="radio"] { display: none; }
        .frame-option label { margin: 0; padding: 10px; border: 2px solid #eee; border-radius: 10px; cursor: pointer; transition: 0.3s; font-size: 12px; }
        .frame-option input[type="radio"]:checked + label { border-color: #ec4899; background-color: #fdf2f8; color: #ec4899; }
        
        /* สไตล์ปุ่ม */
        button { width: 100%; padding: 14px; background-color: #ec4899; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:disabled { background-color: #fbcfe8; cursor: not-allowed; }
        .status-message { margin-top: 15px; text-align: center; color: #10b981; font-weight: bold; display: none; padding: 10px; background-color: #d1fae5; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>ส่งคำอวยพร 🎂</h2>
        <form id="wishForm">
            <label>เลือกสไตล์การ์ด</label>
            <div class="frame-options">
                <div class="frame-option">
                    <input type="radio" id="frame-classic" name="frame" value="classic" checked>
                    <label for="frame-classic">คลาสสิก 🌸</label>
                </div>
                <div class="frame-option">
                    <input type="radio" id="frame-polaroid" name="frame" value="polaroid">
                    <label for="frame-polaroid">โพลารอยด์ 📷</label>
                </div>
                <div class="frame-option">
                    <input type="radio" id="frame-party" name="frame" value="party">
                    <label for="frame-party">ปาร์ตี้ 🎉</label>
                </div>
            </div>

            <label for="imageUpload">แนบรูปภาพ (มีหรือไม่มีก็ได้)</label>
            <input type="file" id="imageUpload" accept="image/*">

            <label for="name">ชื่อของคุณ</label>
            <input type="text" id="name" required placeholder="เช่น พี่โอเบ, น้องเอ">

            <label for="message">คำอวยพร</label>
            <textarea id="message" rows="4" required placeholder="ขอให้มีความสุขมากๆ นะ..."></textarea>

            <button type="submit" id="submitBtn">ส่งคำอวยพรเลย! 🚀</button>
        </form>
        <div id="statusMessage" class="status-message">ส่งคำอวยพรเรียบร้อยแล้ว! 🎉</div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzVyIf_Nl_20thDo7_UO-3KvO-0Eox2HQ3A3i1GnITcZHMDVf7nQGEbCJwxDeo8dlJLzw/exec";

        // ฟังก์ชันบีบอัดรูปภาพก่อนส่ง ป้องกัน Google Sheets พัง
        async function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 400; // ย่อขนาดไม่ให้เกิน 400px
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > MAX_SIZE) {
                            height *= MAX_SIZE / width; width = MAX_SIZE;
                        } else if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height; height = MAX_SIZE;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // แปลงเป็น Base64 แบบ JPEG คุณภาพ 70%
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        document.getElementById('wishForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            submitBtn.innerText = 'กำลังประมวลผล... ⏳';
            submitBtn.disabled = true;
            statusMessage.style.display = 'none';

            try {
                const name = document.getElementById('name').value;
                const message = document.getElementById('message').value;
                const frame = document.querySelector('input[name="frame"]:checked').value;
                
                const imageFile = document.getElementById('imageUpload').files[0];
                let imageBase64 = "";
                
                // ถ้ายูสเซอร์เลือกรูป ให้ย่อรูปก่อน
                if (imageFile) {
                    imageBase64 = await processImage(imageFile);
                }

                submitBtn.innerText = 'กำลังส่ง... 🚀';

                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ name, message, frame, image: imageBase64 })
                });

                statusMessage.style.display = 'block';
                document.getElementById('wishForm').reset();
                
            } catch (error) {
                alert('เกิดข้อผิดพลาด ลองใหม่อีกครั้งนะครับ');
            } finally {
                submitBtn.innerText = 'ส่งคำอวยพรเลย! 🚀';
                submitBtn.disabled = false;
                setTimeout(() => statusMessage.style.display = 'none', 3000);
            }
        });
    </script>
</body>
</html>
